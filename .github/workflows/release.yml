name: Release

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish win-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained build
        run: dotnet publish NexusShell.App/NexusShell.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Inno Setup Installers
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          $version = if ($rawTag -match '^v?([0-9]+\.[0-9]+\.[0-9]+)') { $matches[1] } else { "4.1.1" }
          Write-Host "Building Inno Setup installers for version $version..."
          New-Item -ItemType Directory -Force -Path output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/installer/NexusShell_setup.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/installer/NexusShell_silent_setup.iss

      - name: Package zip + SHA256
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "v4.1.1" }
          $zipName = "NexusShell-$tag-win-x64.zip" -replace '/', '-'
          Compress-Archive -Path publish/* -DestinationPath $zipName

          $filesToHash = @($zipName, "output\NexusShell_Setup.exe", "output\NexusShell_Silent_Setup.exe")
          foreach ($filePath in $filesToHash) {
            if (Test-Path $filePath) {
              $fileName = Split-Path $filePath -Leaf
              $hash = (Get-FileHash $filePath -Algorithm SHA256).Hash.ToLower()
              "$hash  $fileName" | Out-File "$filePath.sha256" -Encoding ascii
              Write-Host "SHA256 of ${fileName}: $hash"
            } else {
              Write-Error "Expected file not found: $filePath"
            }
          }

          "ZIP_NAME=$zipName" | Out-File $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusShell-release-assets
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            output/NexusShell_Setup.exe
            output/NexusShell_Setup.exe.sha256
            output/NexusShell_Silent_Setup.exe
            output/NexusShell_Silent_Setup.exe.sha256

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: "NexusShell ${{ github.ref_name }} — Universal Terminal & Screen Reader Accessibility"
          body: |
            # ⚡ NexusShell ${{ github.ref_name }} Release Notes

            We are proud to release **NexusShell ${{ github.ref_name }}**, delivering a universal, standards-compliant terminal streaming architecture, real-time screen-reader accessibility for interactive CLI tools and AI agents, authentic dynamic PowerShell autocompletion, and rock-solid ConPTY stability.

            ---

            ### 🚀 What's New in ${{ github.ref_name }}:

            * **🖥️ Universal Terminal Streaming & Real-Time TUI Speech:**
              * The Command Input box now operates as a true, real-time terminal input pipeline, streaming keystrokes, navigation keys, and shortcuts directly to interactive CLI tools and AI agents (such as `agy`, `claude`, `inquirer`, and `fzf`).
              * **Live TUI Cursor Announcements:** Navigating interactive menus, slash commands, model pickers, or checkboxes with the **Up/Down Arrow keys** automatically extracts and speaks the active item via UI Automation (`LiveRegionChanged`) for NVDA, JAWS, and Narrator.

            * **⚡ Authentic Dynamic PowerShell Autocompletion:**
              * Powered by an out-of-process PowerShell runspace (`PowerShellCompletionService`) that queries native `CommandCompletion` in real time.
              * Navigate cmdlets, parameters, file paths, and variables using **Up/Down Arrows** with clear positional speech (`"Item, 1 of N"`), and insert completions seamlessly with **Tab** or **Enter** with full caret synchronization.

            * **⌨️ Dual-Mode `Tab` Navigation & Multi-Line Input:**
              * **Smart `Tab` / `Shift + Tab`:** Press `Tab` in the Command Input box to accept an open suggestion, or jump directly to the terminal output area when no suggestions are active. Press `Shift + Tab` from the terminal output to return to the Command Input box.
              * **`Shift + Enter` Multi-Line Drafting:** Write and edit multi-line scripts directly inside the Command Input box before executing.
              * **Universal `Alt` Menu Bar Access:** Pressing `Alt` from anywhere—including inside the Command Input box—reliably activates the application menu bar with full arrow-key navigation.

            * **🔊 Isolated Low-Latency Audio & Deadlock-Free ConPTY Engine:**
              * Typing clicks and state chimes run on isolated background threads so they never clip or interrupt screen reader speech synthesis.
              * Eliminated synchronous pipe buffer stalls and hardened cross-thread WebView2 dispatching to guarantee zero UI freezes across all machines.

            ---

            ### 📦 Asset Files:
            * **`NexusShell_Setup.exe`**: Standard Windows GUI Installer.
            * **`NexusShell_Silent_Setup.exe`**: Silent Background Installer (Recommended for fast upgrades & WinGet).
            * **`${{ env.ZIP_NAME }}`**: Self-contained portable build (no .NET runtime installation required).
          files: |
            output/NexusShell_Setup.exe
            output/NexusShell_Silent_Setup.exe
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            output/NexusShell_Setup.exe.sha256
            output/NexusShell_Silent_Setup.exe.sha256
          generate_release_notes: true

      - name: Publish to Windows Package Manager (winget)
        if: startsWith(github.ref, 'refs/tags/')
        uses: vedantmgoyal2009/winget-releaser@v2
        continue-on-error: true
        with:
          identifier: MF.NexusShell
          installers-regex: 'NexusShell_Silent_Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
