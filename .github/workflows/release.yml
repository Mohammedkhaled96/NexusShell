name: Release

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish win-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained build
        run: dotnet publish NexusShell.App/NexusShell.App.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Inno Setup Installers
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          $version = if ($rawTag -match '^v?([0-9]+\.[0-9]+\.[0-9]+)') { $matches[1] } else { "4.1.1" }
          Write-Host "Building Inno Setup installers for version $version..."
          New-Item -ItemType Directory -Force -Path output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/installer/NexusShell_setup.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/installer/NexusShell_silent_setup.iss

      - name: Package zip + SHA256
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "v4.1.1" }
          $zipName = "NexusShell-$tag-win-x64.zip" -replace '/', '-'
          Compress-Archive -Path publish/* -DestinationPath $zipName

          $filesToHash = @($zipName, "output\NexusShell_Setup.exe", "output\NexusShell_Silent_Setup.exe")
          foreach ($filePath in $filesToHash) {
            if (Test-Path $filePath) {
              $fileName = Split-Path $filePath -Leaf
              $hash = (Get-FileHash $filePath -Algorithm SHA256).Hash.ToLower()
              "$hash  $fileName" | Out-File "$filePath.sha256" -Encoding ascii
              Write-Host "SHA256 of ${fileName}: $hash"
            } else {
              Write-Error "Expected file not found: $filePath"
            }
          }

          "ZIP_NAME=$zipName" | Out-File $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: NexusShell-release-assets
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            output/NexusShell_Setup.exe
            output/NexusShell_Setup.exe.sha256
            output/NexusShell_Silent_Setup.exe
            output/NexusShell_Silent_Setup.exe.sha256

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: "NexusShell ${{ github.ref_name }} — Authentic Terminal Streaming & Accessibility"
          body: |
            # ⚡ NexusShell ${{ github.ref_name }} Release Notes

            We are proud to present **NexusShell ${{ github.ref_name }}**, elevating NexusShell into a true, standards-compliant terminal host with real-time ConPTY input streaming for modern AI agents and CLI tools, dynamic PowerShell autocompletion, multi-line command drafting, and isolated background audio.

            ---

            ### 🚀 What's New in ${{ github.ref_name }}:

            * **🖥️ Authentic Terminal Experience (Input & Output Streaming):**
              * NexusShell now operates as a true, standards-compliant terminal host. The Command Input box streams raw input, navigation keys, and control sequences directly to PowerShell, CMD, and interactive AI agents/brokers (such as `agy`, `claude`, `inquirer`, and `fzf`), providing an authentic terminal environment paired with clean, accessible rendering.
              * **Live Interactive CLI & TUI Speech:** Navigating interactive menus, slash commands, model pickers, or checkboxes with the **Arrow Keys** automatically announces the active selection in real time for NVDA, JAWS, and Narrator.

            * **⚡ Dynamic PowerShell Autocompletion:**
              * High-speed, out-of-process PowerShell runspace (`PowerShellCompletionService`) providing authentic command, cmdlet, parameter, and file path suggestions in real time.
              * Browse suggestions using **Up/Down Arrows** with positional speech feedback (e.g., `"Item, 1 of 12"`), and press **Tab** or **Enter** to apply or **Escape** to dismiss.

            * **✍️ `Shift + Enter` Multi-Line Input & Quiet Decoupled Typing:**
              * **Multi-Line Command Drafting:** Create and edit multi-line commands, scripts, or queries directly in the Command Input box using `Shift + Enter` before executing.
              * **Decoupled, Quiet Typing:** Removed UI binding echo loops so your screen reader only announces your typing cleanly without stuttering.
              * **Enhanced Screen Navigation:** Reliable escape, dismissal, and cancellation handling in interactive command-line sessions.

            * **🔊 Isolated Audio Feedback:**
              * Typing sounds (`KeyType`) and status chimes execute on dedicated background threads to ensure they never clip or interrupt screen reader speech synthesis.

            ---

            ### 📦 Asset Files (All Self-Contained — No External .NET Runtime Required):
            * **`NexusShell_Setup.exe`**: Standard Windows GUI Installer.
            * **`NexusShell_Silent_Setup.exe`**: Silent Background Installer (Recommended for fast upgrades & WinGet).
            * **`${{ env.ZIP_NAME }}`**: Portable ZIP Archive (extract and run directly).
          files: |
            output/NexusShell_Setup.exe
            output/NexusShell_Silent_Setup.exe
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
            output/NexusShell_Setup.exe.sha256
            output/NexusShell_Silent_Setup.exe.sha256
          generate_release_notes: true

      - name: Publish to Windows Package Manager (winget)
        if: startsWith(github.ref, 'refs/tags/')
        uses: vedantmgoyal2009/winget-releaser@v2
        continue-on-error: true
        with:
          identifier: MF.NexusShell
          installers-regex: 'NexusShell_Silent_Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
