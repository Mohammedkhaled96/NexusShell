name: CI

on:
  push:
    branches: [NexusShell_master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NexusShell.sln

      - name: Build
        run: dotnet build NexusShell.sln -c Release --no-restore

      - name: Test
        run: dotnet test NexusShell.sln -c Release --no-build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: NexusShell-build
          path: NexusShell.App/bin/Release/
          retention-days: 7
