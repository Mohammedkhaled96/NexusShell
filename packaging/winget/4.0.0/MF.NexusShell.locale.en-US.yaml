ShortDescription: An accessible terminal environment with clean, screen-reader-friendly command output for NVDA and JAWS.
ReleaseNotes: |-
  - Rebuilt terminal output engine: clean, accurate text with no duplication.
  - Output presented as accessible command blocks (headings + live regions) for NVDA/JAWS.
  - Automatic reduction of excess blank lines; reading-position-aware scrolling.
  - Integrated AI assistance, HTTP API Tester, and SSH/alias/snippet/env/theme managers.
